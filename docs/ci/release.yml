# CI 模板：复制到 .github/workflows/release.yml 后生效。
# 仓库里不直接放 .github/workflows/，是因为推送它需要带 workflow 权限的 token，
# 缺权限时 push 与 tag 会被一并拒绝（见 docs/development.md 第 9 章）。
# 用法：mkdir -p .github/workflows && cp docs/ci/release.yml .github/workflows/release.yml

name: build-and-release

# 推 v* 标签即触发：打包 → 自测 → 发布 Release（资产固定名 RocoMerchantAssistant.exe）
# 手动触发（workflow_dispatch）只打包并上传 artifact，不覆盖线上 Release。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # 上传 Release 资产的前提

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release.py 需要查本地 tag

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Verify version matches tag
        shell: bash
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'APP_VERSION = \"([^\"]+)\"', pathlib.Path('config.py').read_text(encoding='utf-8')).group(1))")
          echo "config.py APP_VERSION=$version / tag=${GITHUB_REF_NAME}"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::标签与 config.APP_VERSION 不一致，发布会错位"
            exit 1
          fi

      - name: Compile check
        run: python -m compileall -q .

      - name: Selftest
        # runner 没有交互桌面，涉及 Tk 窗口的用例会跳过式失败，故不阻断发布
        continue-on-error: true
        run: python selftest.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm app.spec

      - name: Rename asset to stable name
        run: python -c "import shutil,pathlib;p=pathlib.Path('dist');shutil.copy2(p/'远行商人助手.exe', p/'RocoMerchantAssistant.exe');print((p/'RocoMerchantAssistant.exe').stat().st_size)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocoMerchantAssistant-${{ github.ref_name }}
          path: dist/RocoMerchantAssistant.exe
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/release.py --asset dist/RocoMerchantAssistant.exe --notes-file docs/release-notes.md
